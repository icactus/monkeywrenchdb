<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timestamp Adjuster</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        textarea {
            width: 100%;
            height: 300px;
            font-family: monospace;
            font-size: 12px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            resize: vertical;
        }

        input[type="number"] {
            width: 120px;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-right: 10px;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #007AFF;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .info {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            color: #0066cc;
        }

        .error {
            background: #ffe7e7;
            color: #cc0000;
        }

        #status {
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h1>🎵 Timestamp Adjuster</h1>

    <div class="info">
        <strong>How to use:</strong><br>
        1. Paste your timestamp array in the input box<br>
        2. Enter the <code>mix</code> number where you want to change the timestamp<br>
        3. Enter the new <code>t</code> value for that entry<br>
        4. Click "Adjust" — all entries from that point onward will be shifted by the difference
    </div>

    <div class="controls">
        <div class="control-group">
            <label style="margin: 0; margin-right: 8px;">Mix #:</label>
            <input type="number" id="targetMix" placeholder="e.g. 5" value="5">
        </div>
        <div class="control-group">
            <label style="margin: 0; margin-right: 8px;">New t value:</label>
            <input type="number" id="newT" step="0.001" placeholder="e.g. 8.000" value="8.000">
        </div>
        <button class="btn-primary" onclick="adjustTimestamps()">Adjust Timestamps</button>
        <button class="btn-secondary" onclick="copyOutput()">Copy Output</button>
    </div>

    <div class="container">
        <div class="panel">
            <label for="input">Input Array (JSON):</label>
            <textarea id="input" placeholder='Paste your array here, e.g.:
[
    {"t": 0, "mix": 0},
    {"t": 1.128, "mix": 1},
    ...
]'></textarea>
        </div>
        <div class="panel">
            <label for="output">Output Array (Adjusted):</label>
            <textarea id="output" readonly placeholder="Adjusted array will appear here..."></textarea>
        </div>
    </div>

    <div id="status"></div>

    <script>
        function adjustTimestamps() {
            const status = document.getElementById('status');
            const outputEl = document.getElementById('output');

            try {
                // Parse input
                const inputText = document.getElementById('input').value.trim();
                const data = JSON.parse(inputText);

                if (!Array.isArray(data)) {
                    throw new Error('Input must be a JSON array');
                }

                const targetMix = parseInt(document.getElementById('targetMix').value);
                const newT = parseFloat(document.getElementById('newT').value);

                if (isNaN(targetMix) || isNaN(newT)) {
                    throw new Error('Please enter valid numbers for Mix # and new t value');
                }

                // Find the target entry
                const targetIndex = data.findIndex(item => item.mix === targetMix);

                if (targetIndex === -1) {
                    throw new Error(`Could not find entry with mix = ${targetMix}`);
                }

                // Calculate the delta
                const oldT = data[targetIndex].t;
                const delta = newT - oldT;

                // Create adjusted array
                const adjusted = data.map((item, index) => {
                    if (index >= targetIndex) {
                        return { t: parseFloat((item.t + delta).toFixed(3)), mix: item.mix };
                    }
                    return { ...item };
                });

                // Output
                outputEl.value = JSON.stringify(adjusted, null, 2);

                status.className = 'info';
                status.innerHTML = `<strong>Success!</strong> Shifted ${data.length - targetIndex} entries by ${delta >= 0 ? '+' : ''}${delta.toFixed(3)} seconds (starting at mix ${targetMix})`;

            } catch (e) {
                status.className = 'info error';
                status.textContent = 'Error: ' + e.message;
                outputEl.value = '';
            }
        }

        function copyOutput() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');

            const status = document.getElementById('status');
            status.className = 'info';
            status.textContent = 'Copied to clipboard!';
        }
    </script>
</body>

</html>
