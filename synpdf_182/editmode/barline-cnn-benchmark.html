                    totals.attribution.geometry += missedCount;
                });

                totals.truthInternal += pageResult.truthInternalCount;
                totals.geometry.truthSystems += eligibleTruthCount;
                totals.geometry.detectedSystems += eligibleLiveCount;
                totals.geometry.matchedSystems += systemMatch.matches.length;
                totals.performance.geometryMs += geometryMs;
                sourceResult.pages.push(pageResult);

                rendered.page.cleanup();
                canvas.width = 1;
                canvas.height = 1;
                await new Promise(function (resolve) { setTimeout(resolve, 0); });
            }

            await loadingTask.destroy();
            return sourceResult;
        }

        async function sendResult(result) {
            outputNode.textContent = JSON.stringify(result, null, 2);
            document.documentElement.dataset.status = result.ok ? 'complete' : 'error';
            try {
                await fetch(callbackUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(result)
                });
            } catch (callbackError) {
                console.error('Could not deliver benchmark result:', callbackError);
            }
        }

        async function run() {
            var startedAt = new Date().toISOString();
            var wallStart = performance.now();
            var totals = {
                truthInternal: 0,
                excluded: { truthSystems: 0, liveSystems: 0, truthInternal: 0 },
                geometry: { truthSystems: 0, detectedSystems: 0, matchedSystems: 0 },
                proposal: blankStage(),
                cnn: blankStage(),
                final: blankStage(),
                attribution: { geometry: 0, proposal: 0, cnn: 0, suppression: 0, detected: 0 },
                performance: {
                    geometryMs: 0,
                    systems: 0,
                    scanMs: 0,
                    cnnTimeMs: 0,
                    nmsMs: 0,
                    totalMs: 0,
                    candidateCount: 0,
                    cnnCalls: 0,
                    acceptedCount: 0
                }
            };

            try {
                exclusionManifest = await fetchJson('training-folder/barline-cnn-exclusions.json');
                if (exclusionManifest.version !== 1 || !exclusionManifest.sources) {
                    throw new Error('Invalid single-staff exclusion manifest');
                }
                var onnxResources = null;
                if (!geometryOnly) {
                    setStatus('Initializing the ONNX CNN runtime…');
                    onnxResources = await BarlinePatchCNN.loadAsync();
                    if (!onnxResources || !onnxResources.session || !onnxResources.metadata) {
                        throw new Error('ONNX CNN initialization failed; refusing the slow JavaScript fallback');
                    }
                }
                var sources = [];
                for (var sourceIndex = 0; sourceIndex < sourceIds.length; sourceIndex++) {
                    sources.push(await benchmarkSource(
                        sourceIds[sourceIndex],
                        totals,
                        onnxResources ? onnxResources.metadata : null
                    ));
                }
                if (!geometryOnly) {
                    finishStage(totals.proposal, totals.truthInternal);
                    finishStage(totals.cnn, totals.truthInternal);
                    finishStage(totals.final, totals.truthInternal);
                }
                totals.geometry.precision = totals.geometry.detectedSystems
                    ? totals.geometry.matchedSystems / totals.geometry.detectedSystems : 0;
                totals.geometry.recall = totals.geometry.truthSystems
                    ? totals.geometry.matchedSystems / totals.geometry.truthSystems : 0;
                totals.geometry.f1 = totals.geometry.precision + totals.geometry.recall
                    ? 2 * totals.geometry.precision * totals.geometry.recall /
                        (totals.geometry.precision + totals.geometry.recall)
                    : 0;
                var result = {
                    ok: true,
                    benchmark: geometryOnly ? 'live-geometry-only' : 'live-cnn-only',
                    startedAt: startedAt,
                    finishedAt: new Date().toISOString(),
                    wallMs: performance.now() - wallStart,
                    settings: {
                        sources: sourceIds,
                        xTolerancePx: tolerance,
                        cnnThreshold: threshold,
                        endpointsExcluded: true,
                        rasterizer: 'bundled PDF.js',
                        geometry: 'countPix onestf=1',
                        geometryMode: geometryMode,
                        geometryOnly: geometryOnly,
                        classifierMode: geometryOnly ? 'not_run' : 'cnn_only',
                        allowV1Fallback: false,
                        onnxWasmThreads: 1,
                        trainingPatchesIncluded: includePatches
                    },
                    runtime: geometryOnly ? { backend: 'not_run' } : {
                        backend: 'onnx-wasm',
                        inputShape: onnxResources.metadata.input_shape,
                        cropConfig: onnxResources.metadata.crop_config
                    },
                    totals: totals,
                    sources: sources
                };
                setStatus('Complete.');
                await sendResult(result);
            } catch (error) {
                console.error(error);
                setStatus('Failed: ' + error.message);
                await sendResult({
                    ok: false,
                    benchmark: 'live-cnn-only',
                    startedAt: startedAt,
                    finishedAt: new Date().toISOString(),
                    wallMs: performance.now() - wallStart,
                    error: error && error.stack ? error.stack : String(error),
                    browserLogs: window.barlineBenchmarkLogs
                });
            }
        }

        run();
    })();
    </script>
</body>
